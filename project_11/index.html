<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories</title>

    <!-- Tailwind (une seule ligne, pas de configuration) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-6 bg-gray-100">

    <div class="max-w-2xl mx-auto">

        <h1 class="text-2xl font-bold mb-4">Catégories</h1>

        <button id="btn-show-form" class="bg-blue-600 text-white px-4 py-2 rounded mb-4">
            + Nouvelle Catégorie
        </button>

        <p id="message" class="mb-4"></p>

        <div id="section-form" class="bg-white p-4 rounded mb-4">
            <form id="categoryForm">

                <input type="hidden" id="cat-id" value="">

                <label class="block mb-1">Nom de la catégorie</label>
                <!-- The name attribute lets JavaScript send this value to PHP. -->
                <input type="text" id="categoryName" name="name" required placeholder="Ex: Développement Web"
                    class="w-full border p-2 rounded mb-4">

                <button type="button" id="btn-cancel-form" class="border px-4 py-2 rounded">
                    Annuler
                </button>

                <button type="submit" id="botona" class="bg-blue-600 text-white px-4 py-2 rounded">
                    <span id="spinner" class="hidden animate-spin inline-block border-2 border-white border-t-transparent rounded-full w-4 h-4"></span>
                    Enregistrer
                </button>
            </form>
        </div>

        <table class="w-full bg-white rounded text-left">
            <thead>
                <tr class="border-b">
                    <th class="p-3">Nom</th>
                </tr>
            </thead>
            <tbody id="categoryList"></tbody>
        </table>

    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
